[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.2.0"
description = "A personal agent reachable over Telegram, driven by Claude Code, that writes its own skills."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-telegram-bot>=21,<23"]

[project.scripts]
alfred = "alfred.cli:main"

[tool.setuptools]
packages = ["alfred", "alfred.backends"]

[tool.setuptools.package-data]
alfred = ["templates/*", "plugin/.claude-plugin/*", "plugin/bin/*", "plugin/skills/*/*"]
