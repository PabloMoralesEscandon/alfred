[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consiglieri"
version = "0.2.0"
description = "Consiglieri: a set of personal agents reachable over Telegram, driven by Claude Code, that write their own skills."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-telegram-bot>=21,<23"]

[project.optional-dependencies]
# Each bot's own browser (CONSIGLIERI_BROWSER=bot, `consiglieri browser`), where KeePassXC fills in credentials.
browser = ["playwright>=1.55"]

[project.scripts]
consiglieri = "consiglieri.cli:main"

[tool.setuptools]
packages = ["consiglieri", "consiglieri.backends"]

[tool.setuptools.package-data]
consiglieri = ["templates/*", "plugin/.claude-plugin/*", "plugin/bin/*", "plugin/skills/*/*"]
